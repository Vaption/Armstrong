plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.1.0'
}

group = 'li.genesis.armstrong'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url "https://repo.aikar.co/content/groups/aikar/" }
    maven { url 'https://repo.extendedclip.com/releases/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.lunarclient.dev' }
    maven { url 'https://repo.alessiodp.com/releases/' }
    mavenCentral()
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    compileOnly 'com.lunarclient:apollo-api:1.2.0'
    compileOnly 'com.lunarclient:apollo-extra-adventure4:1.2.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.alessiodp.parties:parties-api:3.2.16'
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    implementation 'org.bstats:bstats-bukkit:3.1.0'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.register('runServer', Exec) {
    dependsOn 'shadowJar'
    workingDir "$projectDir/server"

    doFirst {
        def pluginDir = file("$projectDir/server/plugins")
        def pluginJar = fileTree("$buildDir/libs") { include '*.jar' }.files.max { it.lastModified() }

        delete fileTree(pluginDir) { include 'Armstrong-*.jar' }
        copy { from pluginJar; into pluginDir }
    }

    commandLine 'java', '-jar', 'paper.jar', 'nogui'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'co.aikar.commands', 'li.genesis.aikar.commands'
    relocate 'co.aikar.locales', 'li.genesis.aikar.locales'
    relocate 'org.bstats', 'li.genesis.bstats'
}
